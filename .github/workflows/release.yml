name: Release

on:
  push:
    branches: [ main, master ]
    paths:
      - Cargo.toml

permissions:
  contents: read

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Compare package versions across the push
      id: version
      env:
        BEFORE_SHA: ${{ github.event.before }}
      shell: python
      run: |
        import os
        import subprocess
        import tomllib

        previous_manifest = subprocess.check_output(
            ["git", "show", f"{os.environ['BEFORE_SHA']}:Cargo.toml"], text=True
        )
        previous = tomllib.loads(previous_manifest)["package"]["version"]
        with open("Cargo.toml", "rb") as manifest:
            current = tomllib.load(manifest)["package"]["version"]

        print(f"Package version: {previous} -> {current}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"changed={str(current != previous).lower()}\n")
            output.write(f"tag=v{current}\n")

  build:
    name: Build for ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: ccline-linux-x64.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: ccline-linux-x64-static.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            name: ccline-linux-arm64.tar.gz
            use_zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: ccline-linux-arm64-static.tar.gz
            use_zigbuild: true
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: ccline-windows-x64.zip
          - target: x86_64-apple-darwin
            os: macos-latest
            name: ccline-macos-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: ccline-macos-arm64.tar.gz

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: Setup Zig
      if: matrix.use_zigbuild
      uses: mlugg/setup-zig@v2
      with:
        version: 0.13.0

    - name: Install cargo-zigbuild
      if: matrix.use_zigbuild
      run: cargo install cargo-zigbuild

    - name: Install musl tools
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Build binary
      if: ${{ !matrix.use_zigbuild }}
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build binary with zigbuild
      if: matrix.use_zigbuild
      run: cargo zigbuild --release --target ${{ matrix.target }}

    - name: Package Linux/macOS
      if: matrix.os != 'windows-latest' && matrix.target != 'x86_64-pc-windows-gnu'
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/ccometixline dist/ccline
        cd dist
        tar czf ../${{ matrix.name }} ccline

    - name: Package Windows
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/ccometixline.exe dist/ccline.exe
        cd dist
        zip ../${{ matrix.name }} ccline.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: ${{ matrix.name }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ version, build ]
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Generate Release Notes
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --unreleased --tag ${{ needs.version.outputs.tag }} --strip header
      env:
        OUTPUT: RELEASE_NOTES.md

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ needs.version.outputs.tag }}
      run: |
        gh release create "$RELEASE_TAG" artifacts/*/* \
          --target "$GITHUB_SHA" \
          --title "$RELEASE_TAG" \
          --notes-file RELEASE_NOTES.md
